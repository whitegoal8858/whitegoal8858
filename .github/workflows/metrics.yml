name: Metrics
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🚀 Generate 100% Match 2-Column Dashboard Infographic
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: whitegoal8858
          template: classic
          filename: github-metrics.svg
          
          # Exact 2-Column layout matching your screenshot
          config_display: columns
          config_timezone: Asia/Kolkata
          config_order: base.header, pagespeed, isocalendar, habits, languages, topics
          
          # Base profile metadata & overview
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          
          # 1. 🌐 Google PageSpeed Insights (Live audit of your portfolio)
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://sajalsrivastava.me
          plugin_pagespeed_detailed: yes
          
          # 2. 📅 3D Isometric Contributions Calendar & Streak
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # 3. 📊 Coding Habits & Activity Charts (Time of day + Days of week)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # 4. 💻 Language Activity & Most Used Languages
          plugin_languages: yes
          plugin_languages_analysis_head: yes
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          
          # 5. 🛠️ Mastered Technologies & Topics (Icon Grid)
          plugin_topics: yes
          plugin_topics_limit: 24
          plugin_topics_mode: icons
