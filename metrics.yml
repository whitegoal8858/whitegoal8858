name: Metrics
on:
  # Schedule updates every 12 hours (at 00:00 and 12:00 UTC)
  schedule:
    - cron: "0 */12 * * *"
  # Allows manual triggering from the Actions tab anytime
  workflow_dispatch:
  # Run automatically whenever changes are pushed to main/master
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🚀 Generate 100% Match GitHub Metrics Infographic
        uses: lowlighter/metrics@latest
        with:
          # Your GitHub Personal Access Token (or GITHUB_TOKEN for public data)
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: sajalsrivastava
          template: classic
          filename: github-metrics.svg
          
          # Base profile metadata & overview
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Asia/Kolkata
          config_order: base.header, isocalendar, pagespeed, habits, languages, topics, projects
          
          # 1. 🌐 Google PageSpeed Insights (Live audit of your portfolio)
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://sajalsrivastava.me
          plugin_pagespeed_detailed: yes
          
          # 2. 📅 3D Isometric Contributions Calendar & Streak
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # 3. 📊 Coding Habits & Activity Charts (Time of day + Days of week)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # 4. 💻 Language Activity & Most Used Languages
          plugin_languages: yes
          plugin_languages_analysis_head: yes
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          
          # 5. 🛠️ Mastered Technologies & Topics (Icon Grid)
          plugin_topics: yes
          plugin_topics_limit: 24
          plugin_topics_mode: icons
          
          # 6. 📌 GitHub Projects
          plugin_projects: yes
          plugin_projects_limit: 4
          plugin_projects_descriptions: yes
